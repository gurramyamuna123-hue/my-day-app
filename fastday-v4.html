<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7a63f1"><title>FastDay v4</title><style>:root{--p:#7a63f1;--p2:#9b8cf8;--bg:#f6f7fb;--card:#fff;--txt:#182033;--muted:#747d8d;--bd:#e6e8f0;--green:#22b783}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}.app{max-width:760px;margin:auto;padding:16px 12px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--p),#4fc1d5);color:#fff;display:grid;place-items:center;font-size:23px}.brand h1{margin:0;font-size:21px}.muted{color:var(--muted);font-size:12px}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:24px;padding:22px;text-align:center}.hero h2{margin:4px 0 3px}.timer{font-size:40px;font-weight:900;margin:22px 0 4px}.sub{opacity:.9;font-size:13px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:var(--p);color:#fff}.hero .btn{background:#fff;color:var(--p)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat,.card{background:var(--card);border:1px solid var(--bd);border-radius:17px;padding:14px}.stat b{font-size:20px;display:block}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.plan{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}.plan.active{border-color:var(--p);background:#f1efff}.head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 9px}.bar{height:10px;background:#eceef4;border-radius:50px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--green))}.hist{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px}.item b{display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);padding:8px 10px max(8px,env(safe-area-inset-bottom))}.navin{max-width:500px;margin:auto;display:grid;grid-template-columns:1fr 1fr}.nav button{border:0;background:transparent;padding:8px;border-radius:10px;color:var(--muted)}.nav button.active{background:#f1efff;color:var(--p);font-weight:800}.view{display:none}.view.active{display:block}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end;justify-content:center;padding:12px;z-index:30}.modal.open{display:flex}.sheet{width:min(560px,100%);background:#fff;border-radius:22px;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;margin-top:10px}label{font-size:12px;color:var(--muted);font-weight:700}input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:11px;background:#fafbfe}.right{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.ghost{background:#eef0f5;color:var(--txt)}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.plans{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.timer{font-size:34px}}</style></head><body><div class="app"><div class="top"><div class="brand"><div class="logo">⏳</div><div><h1>FastDay</h1><div class="muted">Intermittent Fasting Tracker</div></div></div><div class="muted" id="today"></div></div><main id="fast" class="view active"><section class="hero"><div class="sub" id="status">READY TO START</div><h2 id="title">Choose your fasting plan</h2><div class="timer" id="timer">00:00:00</div><div class="sub" id="caption">Not fasting</div><div class="sub" id="startedInfo" style="margin-top:7px"></div><div class="actions"><button class="btn" id="mainBtn">Start Fast</button><button class="btn" id="earlierBtn">Started Earlier</button></div></section><div class="stats"><div class="stat"><b id="streak">0 🔥</b><span class="muted">Streak</span></div><div class="stat"><b id="total">0h</b><span class="muted">Total fasting</span></div><div class="stat"><b id="best">0h</b><span class="muted">Best fast</span></div></div><div class="head"><h3>Fasting Plan</h3><span class="muted" id="planLabel">16:8</span></div><div class="plans" id="plans"></div><div class="head"><h3>Progress</h3><span class="muted" id="pct">0%</span></div><div class="card"><div class="bar"><span id="bar"></span></div></div></main><main id="history" class="view"><div class="head"><h3>Fasting History</h3></div><div class="hist" id="historyList"></div></main></div><nav class="nav"><div class="navin"><button class="active" data-v="fast">⏳<br>Fast</button><button data-v="history">🕘<br>History</button></div></nav><div class="modal" id="startModal"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h3 id="modalTitle" style="margin:0">I Started Earlier</h3><button class="btn ghost" id="closeModal">✕</button></div><div class="row"><div class="field"><label>Start date</label><input id="startDate" type="date"></div><div class="field"><label>Start time</label><input id="startTime" type="time"></div></div><div class="field"><label>Target fasting hours</label><select id="targetHours"><option>12</option><option>14</option><option selected>16</option><option>18</option><option>20</option><option>24</option></select></div><div class="right"><button class="btn ghost" id="cancelBtn">Cancel</button><button class="btn" id="saveStart">Save Start Time</button></div></div></div><script>(()=>{const KEY='fastday-v1';const $=id=>document.getElementById(id);const E={today:$('today'),status:$('status'),title:$('title'),timer:$('timer'),caption:$('caption'),startedInfo:$('startedInfo'),mainBtn:$('mainBtn'),earlierBtn:$('earlierBtn'),streak:$('streak'),total:$('total'),best:$('best'),planLabel:$('planLabel'),plans:$('plans'),pct:$('pct'),bar:$('bar'),historyList:$('historyList'),startModal:$('startModal'),modalTitle:$('modalTitle'),startDate:$('startDate'),startTime:$('startTime'),targetHours:$('targetHours'),closeModal:$('closeModal'),cancelBtn:$('cancelBtn'),saveStart:$('saveStart')};const PRE=[[12,12],[14,10],[16,8],[18,6],[20,4],[24,0]];const pad=n=>String(n).padStart(2,'0');const h=ms=>ms/36e5;const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;function defaults(){return{plan:{f:16,e:8},active:null,history:[]}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY))||defaults();x.plan=x.plan||{f:16,e:8};x.history=Array.isArray(x.history)?x.history:[];if(x.active&&(!x.active.start||!x.active.targetHours))x.active=null;return x}catch{return defaults()}}let S=load();function save(){localStorage.setItem(KEY,JSON.stringify(S))}function setPlan(f,e){if(S.active)return alert('Current fast end chesi plan change cheyyandi.');S.plan={f,e};save();render()}function startNow(){S.active={start:Date.now(),targetHours:S.plan.f};save();render()}function endFast(){if(!S.active)return;const end=Date.now(),duration=end-S.active.start;S.history.unshift({id:end,start:S.active.start,end,duration,targetHours:S.active.targetHours,completed:duration>=S.active.targetHours*36e5});S.active=null;save();render()}function openEarlier(){const d=S.active?new Date(S.active.start):new Date(Date.now()-36e5);E.startDate.value=dateKey(d);E.startTime.value=`${pad(d.getHours())}:${pad(d.getMinutes())}`;E.targetHours.value=String(S.active?S.active.targetHours:S.plan.f);E.modalTitle.textContent=S.active?'Edit Fasting Start Time':'I Started Earlier';E.startModal.classList.add('open')}function close(){E.startModal.classList.remove('open')}function saveEarlier(){if(!E.startDate.value||!E.startTime.value)return alert('Start date and time select cheyyandi.');const d=new Date(`${E.startDate.value}T${E.startTime.value}:00`);if(Number.isNaN(d.getTime()))return alert('Invalid date/time.');if(d.getTime()>Date.now())return alert('Future time select cheyyakandi.');const target=Number(E.targetHours.value);if(S.active){S.active.start=d.getTime();S.active.targetHours=target}else{S.plan={f:target,e:Math.max(0,24-target)};S.active={start:d.getTime(),targetHours:target}}save();close();render()}function streak(){const done=[...new Set(S.history.filter(x=>x.completed).map(x=>dateKey(new Date(x.end))))].sort().reverse();let d=new Date(),n=0;if(!done.includes(dateKey(d)))d.setDate(d.getDate()-1);for(let i=0;i<365;i++){if(done.includes(dateKey(d))){n++;d.setDate(d.getDate()-1)}else break}return n}function renderHistory(){E.historyList.innerHTML=S.history.length?S.history.map(x=>`<div class="item"><b>${x.completed?'✅':'◻️'} ${h(x.duration).toFixed(1)}h fast</b><span class="muted">${new Date(x.start).toLocaleDateString()} • ${new Date(x.start).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} → ${new Date(x.end).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<div class="card muted">No fasting history yet.</div>'}function tick(){if(!S.active){E.timer.textContent='00:00:00';E.caption.textContent='Not fasting';E.bar.style.width='0%';E.pct.textContent='0%';return}const elapsed=Date.now()-S.active.start,target=S.active.targetHours*36e5,remain=Math.max(0,target-elapsed);E.timer.textContent=`${pad(Math.floor(remain/36e5))}:${pad(Math.floor(remain%36e5/6e4))}:${pad(Math.floor(remain%6e4/1e3))}`;const p=Math.min(100,Math.max(0,elapsed/target*100));E.bar.style.width=p+'%';E.pct.textContent=Math.round(p)+'%';E.caption.textContent=remain>0?'remaining':'fast complete'}function render(){E.plans.innerHTML=PRE.map(([f,e])=>`<button class="plan ${S.plan.f===f&&S.plan.e===e?'active':''}" data-f="${f}" data-e="${e}"><b>${e?f+':'+e:f+'h'}</b><div class="muted">${f}h fasting${e?' • '+e+'h eating':''}</div></button>`).join('');E.plans.querySelectorAll('.plan').forEach(b=>b.onclick=()=>setPlan(Number(b.dataset.f),Number(b.dataset.e)));E.planLabel.textContent=S.plan.e?`${S.plan.f}:${S.plan.e}`:`${S.plan.f}h`;E.mainBtn.textContent=S.active?'End Fast':'Start Fast';E.earlierBtn.textContent=S.active?'Edit Start Time':'Started Earlier';E.status.textContent=S.active?'FASTING NOW':'READY TO START';E.title.textContent=S.active?'You’re fasting':'Choose your fasting plan';E.startedInfo.textContent=S.active?`Started ${new Date(S.active.start).toLocaleDateString([],{day:'numeric',month:'short'})} at ${new Date(S.active.start).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`:'';E.streak.textContent=streak()+' 🔥';E.total.textContent=S.history.reduce((a,x)=>a+h(x.duration),0).toFixed(1)+'h';E.best.textContent=Math.max(0,...S.history.map(x=>h(x.duration))).toFixed(1)+'h';renderHistory();tick()}E.mainBtn.onclick=()=>S.active?endFast():startNow();E.earlierBtn.onclick=openEarlier;E.closeModal.onclick=close;E.cancelBtn.onclick=close;E.saveStart.onclick=saveEarlier;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.v).classList.add('active')});E.today.textContent=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});render();setInterval(tick,1000)})()</script></body></html>
