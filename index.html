<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Day">
<link rel="manifest" href="manifest.webmanifest">
<title>My Day – Personal Planner</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--text:#182033;--muted:#737b8c;--p:#6d5dfc;--p2:#8d80ff;--green:#20b477;--red:#ef5962;--orange:#f59f3a;--border:#e7e9f2;--shadow:0 10px 32px #242a4d12}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:850px;margin:auto;padding:18px 14px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),#4ac7f0);color:#fff;font-size:24px;font-weight:900}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}.date{font-size:12px;color:var(--muted)}.hero{padding:22px;border-radius:23px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:var(--shadow)}.hero h2{margin:5px 0;font-size:26px}.hero p{margin:0 0 18px;opacity:.9}.bar{height:11px;border-radius:50px;background:#ffffff38;overflow:hidden}.bar span{display:block;height:100%;background:#fff;width:0;border-radius:50px;transition:.25s}.barrow{display:flex;justify-content:space-between;margin-top:7px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.stat,.card{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:18px}.stat{padding:13px}.stat b{display:block;font-size:21px}.stat small{color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}.head h3{margin:0}.btn{border:0;border-radius:12px;padding:10px 13px;background:var(--p);color:#fff;font-weight:700}.list{display:grid;gap:9px}.task{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:13px;background:var(--card);border:1px solid var(--border);border-radius:17px}.check{width:24px;height:24px;border:2px solid var(--border);border-radius:8px;background:transparent}.task.done .check{background:var(--green);border-color:var(--green)}.task.done .check:after{content:'✓';color:#fff}.task.done .title{text-decoration:line-through;opacity:.5}.title{font-weight:700}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;color:var(--muted);font-size:11px}.chip{padding:3px 7px;border-radius:99px;background:#f0efff;color:var(--p)}.mini{border:1px solid var(--border);background:transparent;border-radius:9px;padding:7px;color:var(--muted)}.habits{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.habit{padding:15px;background:var(--card);border:1px solid var(--border);border-radius:19px}.habit .icon{font-size:25px}.habit h4{margin:7px 0 2px}.habit p{margin:0;color:var(--muted);font-size:12px}.habitfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.donebtn{border:0;background:#f0efff;color:var(--p);border-radius:11px;padding:8px 10px;font-weight:700}.habit.done .donebtn{background:var(--green);color:#fff}.empty{text-align:center;color:var(--muted);padding:24px;background:var(--card);border:1px dashed var(--border);border-radius:17px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:8px 10px max(8px,env(safe-area-inset-bottom));z-index:20}.navin{max-width:650px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:transparent;padding:8px;color:var(--muted);border-radius:11px}.nav button.active{background:#f0efff;color:var(--p);font-weight:700}.view{display:none}.view.active{display:block}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.sheet{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:22px;padding:18px}.sheettop{display:flex;justify-content:space-between;align-items:center}.sheettop h3{margin:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.field{display:grid;gap:5px}.full{grid-column:1/-1}label{font-size:11px;color:var(--muted);font-weight:700}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:11px;padding:11px;background:var(--bg);color:var(--text)}textarea{min-height:70px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.ghost{background:#f1f2f7;color:var(--text)}.install{display:none;background:#fff7db;border:1px solid #f0d889;border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:13px}.priority-high{color:var(--red)}.priority-medium{color:var(--orange)}.priority-low{color:var(--green)}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.habits{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.app{padding-left:11px;padding-right:11px}.hero h2{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<div class="install" id="installHelp">📱 iPhone: Safari lo <b>Share → Add to Home Screen → Add</b> cheyyandi.</div>
<div class="top"><div class="brand"><div class="logo">✓</div><div><h1>My Day</h1><small>Personal Planner</small></div></div><div class="date" id="dateText"></div></div>
<main id="home" class="view active">
<section class="hero"><small>MY DAY AT A GLANCE</small><h2 id="greet">Hello 👋</h2><p>One day at a time. Keep moving.</p><div class="bar"><span id="pbar"></span></div><div class="barrow"><span>Today's progress</span><b id="ppct">0%</b></div></section>
<div class="stats"><div class="stat"><b id="sTasks">0</b><small>Tasks</small></div><div class="stat"><b id="sDone">0</b><small>Done</small></div><div class="stat"><b id="sHabits">0</b><small>Habits</small></div><div class="stat"><b id="sStreak">0🔥</b><small>Best streak</small></div></div>
<div class="head"><h3>Today's Tasks</h3><button class="btn" onclick="openTask()">+ Add Task</button></div><div id="homeTasks" class="list"></div>
<div class="head"><h3>Today's Habits</h3><button class="btn" onclick="openHabit()">+ Add Habit</button></div><div id="homeHabits" class="habits"></div>
</main>
<main id="tasks" class="view"><div class="head"><h3>My Tasks</h3><button class="btn" onclick="openTask()">+ New</button></div><div id="allTasks" class="list"></div></main>
<main id="habits" class="view"><div class="head"><h3>My Habits</h3><button class="btn" onclick="openHabit()">+ New</button></div><div id="allHabits" class="habits"></div></main>
</div>
<nav class="nav"><div class="navin"><button class="active" data-view="home">🏠<br>Home</button><button data-view="tasks">✅<br>Tasks</button><button data-view="habits">🎯<br>Habits</button></div></nav>
<div class="modal" id="taskModal"><div class="sheet"><div class="sheettop"><h3 id="taskHeading">Add Task</h3><button class="mini" onclick="closeM('taskModal')">✕</button></div><div class="form"><div class="field full"><label>Task</label><input id="tTitle" placeholder="What do you want to finish?"></div><div class="field"><label>Date</label><input id="tDate" type="date"></div><div class="field"><label>Time</label><input id="tTime" type="time"></div><div class="field"><label>Category</label><select id="tCat"><option>Personal</option><option>Home</option><option>Work</option><option>Study</option><option>Family</option><option>Kids</option><option>Health</option></select></div><div class="field"><label>Priority</label><select id="tPri"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div><div class="field full"><label>Notes</label><textarea id="tNotes"></textarea></div></div><div class="actions"><button class="btn ghost" onclick="closeM('taskModal')">Cancel</button><button class="btn" onclick="saveTask()">Save</button></div></div></div>
<div class="modal" id="habitModal"><div class="sheet"><div class="sheettop"><h3 id="habitHeading">Add Habit</h3><button class="mini" onclick="closeM('habitModal')">✕</button></div><div class="form"><div class="field full"><label>Habit</label><input id="hName" placeholder="e.g. Walk 30 minutes"></div><div class="field"><label>Icon</label><select id="hIcon"><option>🚶</option><option>💧</option><option>📚</option><option>🧘</option><option>🏋️</option><option>🥗</option><option>🙏</option><option>💻</option></select></div><div class="field"><label>Target</label><input id="hTarget" placeholder="30 min / 2 litres"></div></div><div class="actions"><button class="btn ghost" onclick="closeM('habitModal')">Cancel</button><button class="btn" onclick="saveHabit()">Save</button></div></div></div>
<script>
const KEY='my-day-personal-v2';let state=load(),editT=null,editH=null;
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function day(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${x}`}
function seed(){let t=day();return{tasks:[{id:id(),title:'Plan my day',date:t,time:'08:00',cat:'Personal',pri:'high',notes:'Choose the 3 most important things.',done:false},{id:id(),title:'Finish one important task',date:t,time:'11:00',cat:'Work',pri:'high',notes:'',done:false}],habits:[{id:id(),name:'Drink Water',icon:'💧',target:'Daily target',history:[]},{id:id(),name:'Walk / Exercise',icon:'🚶',target:'30 min',history:[]},{id:id(),name:'Study / Learn',icon:'📚',target:'1 hour',history:[]}]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function streak(h){let set=new Set(h.history||[]),d=new Date(),n=0;if(!set.has(day(d)))d.setDate(d.getDate()-1);for(let i=0;i<500;i++){if(set.has(day(d))){n++;d.setDate(d.getDate()-1)}else break}return n}
function taskHTML(t){return `<article class="task ${t.done?'done':''}"><button class="check" onclick="toggleTask('${t.id}')"></button><div><div class="title">${esc(t.title)}</div><div class="meta"><span class="chip">${esc(t.cat)}</span>${t.time?`<span>⏰ ${esc(t.time)}</span>`:''}<span class="priority-${t.pri}">● ${t.pri}</span></div></div><div><button class="mini" onclick="editTask('${t.id}')">✏️</button> <button class="mini" onclick="delTask('${t.id}')">🗑️</button></div></article>`}
function habitHTML(h){let done=(h.history||[]).includes(day());return `<article class="habit ${done?'done':''}"><div class="icon">${h.icon}</div><h4>${esc(h.name)}</h4><p>${esc(h.target||'Daily')}</p><div class="habitfoot"><b>🔥 ${streak(h)} days</b><span><button class="mini" onclick="editHabit('${h.id}')">✏️</button> <button class="donebtn" onclick="toggleHabit('${h.id}')">${done?'Done ✓':'Mark done'}</button></span></div></article>`}
function render(){let today=day(),todayTasks=state.tasks.filter(t=>t.date===today),done=todayTasks.filter(t=>t.done).length,hd=state.habits.filter(h=>(h.history||[]).includes(today)).length,total=todayTasks.length+state.habits.length,p=total?Math.round((done+hd)/total*100):0;document.getElementById('pbar').style.width=p+'%';document.getElementById('ppct').textContent=p+'%';document.getElementById('sTasks').textContent=todayTasks.length;document.getElementById('sDone').textContent=done;document.getElementById('sHabits').textContent=hd+'/'+state.habits.length;document.getElementById('sStreak').textContent=Math.max(0,...state.habits.map(streak))+'🔥';homeTasks.innerHTML=todayTasks.length?todayTasks.map(taskHTML).join(''):'<div class="empty">No tasks for today ✨</div>';allTasks.innerHTML=state.tasks.length?state.tasks.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(taskHTML).join(''):'<div class="empty">No tasks yet.</div>';homeHabits.innerHTML=state.habits.length?state.habits.map(habitHTML).join(''):'<div class="empty">No habits yet.</div>';allHabits.innerHTML=homeHabits.innerHTML}
function toggleTask(x){let t=state.tasks.find(a=>a.id===x);if(t)t.done=!t.done;save();render()}
function toggleHabit(x){let h=state.habits.find(a=>a.id===x),d=day();if(!h)return;h.history=h.history||[];let i=h.history.indexOf(d);i>=0?h.history.splice(i,1):h.history.push(d);save();render()}
function openTask(){editT=null;taskHeading.textContent='Add Task';tTitle.value='';tDate.value=day();tTime.value='';tCat.value='Personal';tPri.value='medium';tNotes.value='';taskModal.classList.add('open')}
function editTask(x){let t=state.tasks.find(a=>a.id===x);if(!t)return;editT=x;taskHeading.textContent='Edit Task';tTitle.value=t.title;tDate.value=t.date;tTime.value=t.time;tCat.value=t.cat;tPri.value=t.pri;tNotes.value=t.notes||'';taskModal.classList.add('open')}
function saveTask(){let title=tTitle.value.trim();if(!title)return alert('Task name enter cheyyandi.');let obj={title,date:tDate.value||day(),time:tTime.value,cat:tCat.value,pri:tPri.value,notes:tNotes.value.trim()};if(editT)Object.assign(state.tasks.find(a=>a.id===editT),obj);else state.tasks.push({id:id(),...obj,done:false});save();closeM('taskModal');render()}
function delTask(x){if(confirm('Delete this task?')){state.tasks=state.tasks.filter(a=>a.id!==x);save();render()}}
function openHabit(){editH=null;habitHeading.textContent='Add Habit';hName.value='';hIcon.value='🚶';hTarget.value='';habitModal.classList.add('open')}
function editHabit(x){let h=state.habits.find(a=>a.id===x);if(!h)return;editH=x;habitHeading.textContent='Edit Habit';hName.value=h.name;hIcon.value=h.icon;hTarget.value=h.target||'';habitModal.classList.add('open')}
function saveHabit(){let name=hName.value.trim();if(!name)return alert('Habit name enter cheyyandi.');let obj={name,icon:hIcon.value,target:hTarget.value.trim()};if(editH)Object.assign(state.habits.find(a=>a.id===editH),obj);else state.habits.push({id:id(),...obj,history:[]});save();closeM('habitModal');render()}
function closeM(x){document.getElementById(x).classList.remove('open')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.view).classList.add('active')});
let n=new Date();dateText.textContent=n.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});greet.textContent=(n.getHours()<12?'Good morning':n.getHours()<17?'Good afternoon':'Good evening')+' 👋';if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)installHelp.style.display='block';if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));render();
</script>
</body>
</html>
